plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.voicerecorder'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.voicerecorder"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "2.4"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.github.axet:lame:1.0.9'                  // MP3 encoder (LAME, prebuilt)
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'    // on-device speech recognition (16 KB aligned)
    implementation 'net.java.dev.jna:jna:5.19.1@aar'            // 16 KB page-size compatible JNA

    testImplementation 'junit:junit:4.13.2'
}

// kotlin-stdlib 1.8+ already contains the jdk7/jdk8 classes; drop the old split jars
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
