plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.voicerecorder'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.voicerecorder"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.github.axet:lame:1.0.9'   // MP3 encoder (LAME, prebuilt)
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'  // on-device speech recognition
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}

// kotlin-stdlib 1.8+ already contains the jdk7/jdk8 classes; drop the old split jars
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
